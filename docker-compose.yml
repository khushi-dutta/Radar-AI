services:
  api:
    build: ./backend
    environment:
      PORT: 4000
      # Override in a real deployment; the server refuses the dev default
      # when NODE_ENV=production.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      DB_PATH: /data/radar.db
    volumes:
      - radar-data:/data
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  radar-data:
